<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Medical Chatbot</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
</head>
<body>
  <div class="chat-container">
    <header class="chat-header">Medical Chatbot</header>

    <div id="messages" class="messages"></div>

    <form id="chat-form" class="chat-form">
      <input
        id="msg"
        name="msg"
        type="text"
        placeholder="Ask a medical question..."
        autocomplete="off"
        required
      />
      <button type="submit">Send</button>
    </form>
  </div>

  <script>
    const form = document.getElementById("chat-form");
    const input = document.getElementById("msg");
    const messages = document.getElementById("messages");

    function appendUserMessage(text) {
      const bubble = document.createElement("div");
      bubble.className = "bubble user";
      bubble.textContent = text;
      messages.appendChild(bubble);
      messages.scrollTop = messages.scrollHeight;
    }

    function appendBotMessage(data) {
      const bubble = document.createElement("div");
      bubble.className = "bubble bot";
      if (data.confidence === "emergency") bubble.classList.add("emergency");
      if (data.confidence === "low") bubble.classList.add("low-confidence");

      const answerEl = document.createElement("div");
      answerEl.className = "answer-text";
      answerEl.textContent = data.answer;
      bubble.appendChild(answerEl);

      if (data.sources && data.sources.length > 0) {
        const sourcesEl = document.createElement("div");
        sourcesEl.className = "sources";

        const title = document.createElement("div");
        title.className = "sources-title";
        title.textContent = "Sources";
        sourcesEl.appendChild(title);

        data.sources.forEach((s) => {
          const item = document.createElement("div");
          item.className = "source-item";
          const page = s.page !== null && s.page !== undefined ? ` (p. ${s.page})` : "";
          item.textContent = `${s.source}${page} — "${s.excerpt}..." (match ${s.score})`;
          sourcesEl.appendChild(item);
        });

        bubble.appendChild(sourcesEl);
      }

      messages.appendChild(bubble);
      messages.scrollTop = messages.scrollHeight;
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      const text = input.value.trim();
      if (!text) return;

      appendUserMessage(text);
      input.value = "";

      const body = new URLSearchParams({ msg: text });
      const response = await fetch("/get", { method: "POST", body });
      const data = await response.json();

      appendBotMessage(data);
    });
  </script>
</body>
</html>
